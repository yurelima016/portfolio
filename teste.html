<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background com Gradiente Customizado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            
            /* 1. GRADIENTE ATUALIZADO 
              Aqui está o gradiente linear vertical com as cores e "stops"
              exatos que você forneceu na imagem.
            */
            background: linear-gradient(
                to bottom,
                #2E2E2E 15%,
                #6F3913 70%,
                #B1500A 90%,
                #FF6B00 98%,
                #FF964B 100%
            );
            
            position: relative;
            z-index: 1;
            overflow: hidden; /* Evita barras de rolagem desnecessárias */
        }

        .background-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            z-index: -1; 
            height: 75%; /* Você pode ajustar a altura das ondas aqui */
        }

    </style>
</head>
<body>
    <div class="background-waves">
        <svg xmlns="http://www.w3.org/2000/svg" 
             viewBox="0 0 1440 320" 
             preserveAspectRatio="none" 
             style="width: 100%; height: 100%;">

                  d="M0,192L48,176C96,160,192,128,288,133.3C384,139,480,181,576,202.7C672,224,768,224,864,208C960,192,1056,160,1152,149.3C1248,139,1344,149,1392,154.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">

</body>
</html>
